# Interactive 3D viser demos (rendered by _includes/sections/about.html)
#
# Each entry becomes one tile in the 2x2 .demo-grid. The iframes load directly
# (lazily on scroll), so the four scenes are ~65 MB of page weight.
#
#   title    tile label + iframe title (required)
#   file     path under /recordings/ (required)
#   size     rough download weight, for reference when budgeting the page
#   caption  text under the tile; falls back to title
#   link     optional project page for the caption
#   camera   optional raw query fragment (NO leading &) appended to the client URL.
#            Grab one by opening a scene with &logCamera, orbiting to the view you
#            want, and copying the params the console prints.
#            initialCameraFov / Near / Far only work in viser-client-1.0.22.
#            Omit to use the initial camera baked into the .viser file.
#   kind     `real` (real-world, 1x speed, autonomous) or `synthetic` (rendered).
#            Drives the badge under the tile; `tag:` overrides the badge text.
#   client   which hosted viser client to play it in. REQUIRED and not cosmetic:
#            .viser containers are NOT cross-version compatible. The legacy
#            `viser-client` uses DecompressionStream("gzip"); viser >= ~1.0 writes
#            zstd with an 8-byte size header. Mixing them fails at load time
#            ("incorrect header check" / "Offset is outside the bounds of the
#            DataView"). Check which one a new recording needs before shipping.
#   sway     optional idle camera-sway scale (default 1 = +/-10-17 deg azimuth). Use a small
#            value for tight, close-in framings (e.g. a camera inside the robot cell), or the
#            sway swings the view onto the cell walls.
#   scene    optional raw query fragment (NO leading &) of scene tweaks from
#            /viser-idle-sway.js. `clipAbove=<h>,<hex>` cuts meshes of material colour <hex>
#            above height <h> m; the YAM cell tiles use it to drop the top 8020 rails
#            (the frame is one #999ead mesh; its top rails sit at 1.64-1.68 m).
#            `hideLines=<hex>` hides line objects of that colour (the YAM tiles hide the
#            yellow #ffaa3c overhead-camera frustum wireframe).

- title: Egocentric Manipulation Interface (EgoMI)
  file: egomi/recording_20251022_210201.viser
  kind: real
  size: 8.5 MB   # camera frames re-encoded PNG -> JPEG q85 (was 40 MB)
  caption: Egocentric Manipulation Interface
  link: https://egocentric-manipulation-interface.github.io/
  client: viser-client
  camera: "initialCameraPosition=-0.480,1.004,1.674&initialCameraLookAt=0.212,0.032,0.923&initialCameraUp=0.000,0.000,1.000"

- title: Real2Render2Real (R2R2R)
  file: coffee_maker_recording_20250506_191701.viser
  kind: synthetic
  size: 21 MB    # camera frames re-encoded PNG -> JPEG q85 (was 71 MB)
  caption: Real2Render2Real
  link: https://real2render2real.com/
  client: viser-client
  sway: 0.025   # tiny: the camera frustum right in front of the camera is part of the
                #   composition, and any orbit parallaxes it a lot
  camera: "initialCameraPosition=0.989,0.425,0.609&initialCameraLookAt=0.233,-0.046,-0.237&initialCameraUp=-0.000,-0.000,1.000"

- title: WARP-RM — T-Shirt Folding
  file: tshirt_episode.viser
  kind: real
  client: viser-client-1.0.22
  sway: 0.35
  scene: "clipAbove=1.62,999ead&hideLines=ffaa3c"   # drop top 8020 rails + yellow frustum wireframes
  size: 21 MB
  caption: WARP-RM
  link: https://uynitsuj.github.io/warp-rm/
  camera: "initialCameraPosition=-0.071,-0.003,1.654&initialCameraLookAt=0.510,-0.006,1.132&initialCameraUp=-0.000,0.000,1.000&initialCameraFov=1.3090&initialCameraNear=0.01&initialCameraFar=1000"

- title: WARP-RM — Bottle Into Bin
  file: bottles_episode.viser
